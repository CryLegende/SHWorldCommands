# SHWorldCommands
#
# Exécute une commande pour un joueur seulement quand il est dans un monde autorisé (whitelisted-worlds). Ailleurs,
# la commande attend et part dès qu'il entre dans un de ces mondes ou se reconnecte dedans. Sert aux récompenses à
# donner sur l'île (objets, clés...), souvent via SHQueueCommands : qc queue <joueur> shwc <joueur> <commande>.
#
# Commande :
#   /shwc <joueur> <commande>   Exécute la commande en console tout de suite si le joueur est dans un monde autorisé,
#                               sinon la met en attente et le prévient (notification). %player% = pseudo du joueur.
#
# Permission :
#   shworldcommands.use   Utiliser /shwc (op par défaut).
#
# Les textes de /shwc sont dans messages.yml.

# Mondes où les commandes en attente seront exécutées.
whitelisted-worlds:
  - "SuperiorWorld"

# Notification envoyée au joueur lorsqu'il reçoit une commande dans un monde non autorisé.
# Vous pouvez laisser n'importe quel champ vide (ex: title: "") pour ne pas l'afficher.
notification:
  # Durées pour l'affichage du titre (en secondes).
  title-timing:
    fade-in: 0  # Temps d'apparition
    stay: 3     # Temps de maintien à l'écran
    fade-out: 1 # Temps de disparition
    
  # Le titre principal affiché au centre de l'écran.
  title: "&6⌛ &eNouvelle récompense &6⌛"
  
  # Le sous-titre, affiché sous le titre principal.
  subtitle: "&fRetourner sur votre île pour la récupérer"
  
  # La barre d'action, affichée juste au-dessus de la barre de raccourcis.
  actionbar: "&6⌛ &eNouvelle récompense &6⌛ &7| &fRetourner sur votre île pour la récupérer"
  
  # Le message dans le chat. Vous pouvez toujours utiliser plusieurs lignes.
  # Le formatage avec |- permet de conserver les sauts de ligne.
  message: |-
    &r
    &7&l« &e&k!!!&r &6&lNouvelle Récompense en attente &e&k!!!&r &8&l»
    &r
    &r &6Vous avez reçu une récompense,
    &r    &6mais êtes dans un monde blacklisté.
    &r 
    &8&o(( &e&oRetournez sur votre île pour la recevoir ! &8&o))
    &r

# Mode réseau : avec SHNetwork, une seule liste d'attente pour tous les serveurs, en MariaDB (table shwc_pending).
# Joueur connecté sur un autre serveur : /shwc y est relancée. Commande en attente : réclamée par le serveur où le joueur
# entre dans un monde autorisé (une seule fois pour tout le réseau). Un monde qui n'existe que sur un serveur ne
# déclenche donc que sur celui-là. Au premier démarrage en mode réseau, commands.yml de ce serveur est repris une fois
# pour tout le réseau ; chaque serveur renomme ensuite le sien en commands.yml.avant-reseau.
# Si la base est injoignable, le plugin se désactive sur ce serveur (jamais de retour au fichier local).
# Sans SHNetwork, cette section ne sert pas.
reseau:
  actif: true
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shworldcommands
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000
