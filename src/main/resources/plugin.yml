name: SHWorldCommands
version: '${project.version}'
main: org.Cry_Legende.sHWorldCommands.SHWorldCommands
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, les commandes en attente restent dans commands.yml de ce serveur.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : seul le mode réseau (base commune) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shwc:
    description: Stocke ou exécute immédiatement une commande pour un joueur selon son monde
    usage: /shwc <player> <command>
    permission: shworldcommands.use

permissions:
  shworldcommands.use:
    description: Permet d’utiliser la commande /shwc
    default: op
