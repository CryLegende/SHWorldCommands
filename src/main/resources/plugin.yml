name: SHWorldCommands
version: '${project.version}'
main: org.Cry_Legende.sHWorldCommands.SHWorldCommands
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, les commandes en attente restent dans commands.yml de ce serveur.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : seul le mode réseau (base commune) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shworldcommands:
    description: Exécute ou met en attente une commande pour un joueur selon son monde, et administration du plugin
    usage: /shworldcommands run <joueur> <commande>
    aliases: [shwc]

permissions:
  shworldcommands.use:
    description: Exécuter ou mettre en attente une commande pour un joueur (/shworldcommands run, ancienne /shwc <joueur> <commande>)
    default: op
  shworldcommands.admin:
    description: Toutes les sous-commandes d'administration de /shworldcommands (reload, list, clear)
    default: op
    children:
      shworldcommands.admin.reload: true
      shworldcommands.admin.list: true
      shworldcommands.admin.clear: true
  shworldcommands.admin.reload:
    description: /shworldcommands reload (recharger config.yml et messages.yml)
    default: op
  shworldcommands.admin.list:
    description: /shworldcommands list (commandes en attente)
    default: op
  shworldcommands.admin.clear:
    description: /shworldcommands clear (supprimer les commandes en attente d'un joueur)
    default: op
